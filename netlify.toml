[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Permite abrir o recargar cualquier página interna (por ejemplo /cotizaciones/123)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los archivos de la aplicación llevan un código único en su nombre: se pueden guardar en caché por mucho tiempo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La página principal siempre se revisa para tomar la versión más reciente después de cada publicación
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
